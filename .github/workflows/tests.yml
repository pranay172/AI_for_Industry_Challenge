name: tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # The locked environment (ROS 2, PyTorch with CUDA wheels) needs about 10 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      # locked: the install fails if pixi.lock is out of date with the manifests.
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.67.2
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Offline test suite (CPU)
        run: pixi run python -m pytest tests -q
